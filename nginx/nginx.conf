# Reverse proxy for Verdant LMS.
# TLS certs live in ./nginx/certs (fullchain.pem / privkey.pem) via certbot.
# To run HTTP-only for an initial test, comment out the 443 server block and
# the redirect, and have the port-80 block proxy_pass to verdant_web directly.

# Large uploads / recording proxying.
client_max_body_size 2g;

upstream verdant_web {
    server web:3000;
}

# HTTP -> HTTPS redirect (also serves the ACME challenge for certbot).
server {
    listen 80;
    server_name lms.varun101.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lms.varun101.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # App. Object files (uploads/recordings) are served directly from AWS S3
    # via each org's S3 public URL, so there's no /files/ proxy here.
    location / {
        proxy_pass http://verdant_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
